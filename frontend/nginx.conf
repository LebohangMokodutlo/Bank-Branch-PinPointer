server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app fallback: any path that isn't a real file (e.g. a client-side route)
    # should still serve index.html so React Router/our own JS can take over, instead of
    # nginx returning its own 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forwards /api/* to the API container over the docker-compose network (service name
    # "api"), so the browser only ever talks to one origin (this nginx server) and we avoid
    # configuring a public URL/CORS differently per environment.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
